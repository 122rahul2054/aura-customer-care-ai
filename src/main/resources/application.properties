spring.application.name=aura-voice

server.port=${PORT:8080}

aura.api-key=${GEMINI_API_KEY}

aura.model=${GEMINI_MODEL:gemini-3.6-flash}

aura.base-url=https://generativelanguage.googleapis.com/v1beta

server.error.include-message=never
server.error.include-stacktrace=never

spring.mvc.async.request-timeout=90000